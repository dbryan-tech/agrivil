name: Build AgriVil Android APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Consumer APK (AgriVil Marketplace)
        working-directory: mobile/android
        run: ./gradlew :consumer:assembleDebug

      - name: Build Farmer APK (AgriVil Farmer Cockpit)
        working-directory: mobile/android
        run: ./gradlew :admin:assembleDebug

      - name: Upload Consumer APK
        uses: actions/upload-artifact@v4
        with:
          name: AgriVil-Consumer-Debug
          path: mobile/android/consumer/build/outputs/apk/debug/*.apk

      - name: Upload Farmer APK
        uses: actions/upload-artifact@v4
        with:
          name: AgriVil-Farmer-Debug
          path: mobile/android/admin/build/outputs/apk/debug/*.apk
