// Two fully-independent app modules (no shared mutable source):
//   :consumer -> com.agrivil.marketplace (marketplace, loads /m)
//   :admin    -> com.agrivil.farmer      (farmer cockpit, loads /m/farmer)
// Both share ONLY the read-only Capacitor library modules below.
include ':consumer'
include ':admin'

include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
